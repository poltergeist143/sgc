<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="softGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="230" r="190" fill="url(#haloGlow)" />

  <!-- Outer Elegant Ring -->
  <circle cx="250" cy="240" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.75" />
  <circle cx="250" cy="240" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />

  <!-- Radiating Sunbeams -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.35">
    <line x1="250" y1="30" x2="250" y2="70" />
    <line x1="250" y1="410" x2="250" y2="450" />
    <line x1="40" y1="240" x2="80" y2="240" />
    <line x1="420" y1="240" x2="460" y2="240" />
    <line x1="105" y1="95" x2="135" y2="125" />
    <line x1="395" y1="95" x2="365" y2="125" />
    <line x1="105" y1="385" x2="135" y2="355" />
    <line x1="395" y1="385" x2="365" y2="355" />
  </g>

  <!-- The Open Bible Base -->
  <g id="open-bible">
    <!-- Bible Base Shadow -->
    <path d="M 140,360 Q 250,385 360,360 L 370,390 Q 250,410 130,390 Z" fill="#6B4E17" opacity="0.6"/>
    <!-- Left Page -->
    <path d="M 130,355 Q 190,340 250,355 L 250,395 Q 190,380 130,395 Z" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Right Page -->
    <path d="M 250,355 Q 310,340 370,355 L 370,395 Q 310,380 250,395 Z" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Center Spine & Ribbon Bookmark -->
    <path d="M 248,355 L 252,355 L 252,415 L 248,415 Z" fill="#C5A059" />
    <path d="M 250,355 Q 260,390 270,410 L 260,412 Q 250,390 248,355 Z" fill="#AA7C11" opacity="0.8" />
    <!-- Script lines on left page -->
    <line x1="155" y1="365" x2="230" y2="361" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="155" y1="373" x2="225" y2="369" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="155" y1="381" x2="220" y2="377" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <!-- Script lines on right page -->
    <line x1="270" y1="361" x2="345" y2="365" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="275" y1="369" x2="345" y2="373" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="280" y1="377" x2="345" y2="381" stroke="#AA7C11" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- The Latin Cross Rising from Scripture -->
  <g id="holy-cross" filter="url(#subtleGlow)">
    <!-- Vertical Beam -->
    <rect x="238" y="100" width="24" height="260" rx="3" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5" />
    <!-- Horizontal Crossbeam -->
    <rect x="175" y="165" width="150" height="24" rx="3" fill="url(#goldGrad)" stroke="#FFE082" stroke-width="1.5" />
    <!-- Center Flare Accent -->
    <polygon points="250,162 256,177 271,177 259,186 263,200 250,192 237,200 241,186 229,177 244,177" fill="#FFFDF9" />
  </g>

  <!-- Holy Spirit Dove in Flight -->
  <g id="holy-dove" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round">
    <!-- Wings and Body -->
    <path d="M 250,135
             C 240,115 210,110 185,120
             C 175,124 165,135 180,140
             C 205,148 228,154 242,162
             C 245,164 246,172 242,185
             C 246,182 254,182 258,185
             C 254,172 255,164 258,162
             C 272,154 295,148 320,140
             C 335,135 325,124 315,120
             C 290,110 260,115 250,135 Z" fill="#FFFFFF" filter="url(#subtleGlow)" />
    <!-- Olive branch / Light tip -->
    <circle cx="250" cy="130" r="4.5" fill="#FFE082" />
  </g>
</svg>
